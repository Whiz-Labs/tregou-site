[build]
  command = "npm run build"
  publish = "dist"

# Güvenli redirect (www -> non-www veya tersi)
[[redirects]]
  from = "https://www.tregou.app/*"
  to = "https://tregou.app/:splat"
  status = 301
  force = true

# Kurye kapısı: "Sou entregador" doğrudan uygulama sayfasına (Tregou flow 1, app-install.from-site).
# Eski ön kayıt anketi yerine; ?ref= (davet) ve ?src= sorgusu olduğu gibi taşınır.
[[redirects]]
  from = "/entregador"
  to = "https://panel.tregou.app/app"
  status = 302
  force = true

# SPA gibi davranması gerekirse (opsiyonel, Astro için genelde gerekmez)
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
